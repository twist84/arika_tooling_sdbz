name: Hybrid editor transform parity

on:
  pull_request:
    paths:
      - 'arika-py_on_rs/**'
      - 'arika-rs/arika_core/**'
      - 'elf_tooling/elf_video_modes.py'
      - 'elf_tooling/test_elf_video_modes.py'
      - 'elf_tooling/elf_menu_arrows.py'
      - 'elf_tooling/test_elf_menu_arrows.py'
      - '.github/workflows/hybrid-editor-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Build hybrid backend
        working-directory: arika-py_on_rs
        run: python build.py
      - name: Test native transform math
        working-directory: arika-py_on_rs
        run: cargo test --lib
      - name: Test editor gizmos and stage viewport
        working-directory: arika-py_on_rs
        run: |
          python -m pip install -r requirements_scene_editor.txt
          python -m unittest test_arika_editor_shutdown test_arika_stage_background test_arika_scene_project test_arika_gizmo test_arika_stage_view3d test_arika_models test_arika_animation_preview test_arika_scene_characters test_arika_skinning test_arika_menu_navigation test_arika_menu_input test_arika_menu_runtime test_arika_menu_first_lifecycle test_arika_menu_idle test_arika_menu_circular_idle test_arika_menu_dragon_idle test_arika_menu_native_trig test_arika_menu_emphasis test_arika_menu_phase6_transitions test_arika_menu_particles test_arika_menu_particle_teardown test_arika_menu_particle_draw test_arika_menu_particle_uv test_arika_menu_rng_interleave test_arika_menu_shared_visual_runtime test_arika_menu_shared_draw test_arika_menu_gs_state test_arika_menu_gs_packet test_arika_menu_gs_context test_arika_menu_gs_registers test_arika_menu_gs_texture test_arika_menu_coupled_idle test_arika_menu_arrow_preview test_arika_menu_frame_match test_arika_menu_help_geometry test_arika_menu_help_native test_arika_menu_ffon_native test_arika_menu_pcsx2_comparison test_compare_menu_captures test_arika_menu_help_lifecycle test_arika_menu_editor_navigation -v
          python -m py_compile arika_editor.py arika_scene_editor.py arika_scene_project.py arika_stage_background.py arika_animation_preview.py arika_menu_navigation.py arika_menu_input.py arika_menu_runtime.py arika_menu_children.py arika_menu_first.py arika_menu_particles.py menu_lifecycle_oracle.py arika_menu_editor.py arika_menu_gs_texture.py arika_menu_gs_texture_elf_oracle.py arika_menu_help_geometry.py arika_menu_help_native.py arika_menu_ffon_native.py arika_menu_pcsx2_comparison.py arika_menu_pcsx2_dialog.py compare_menu_captures.py arika_menu_help_lifecycle.py arika_menu_native_trig.py
      - name: Test ELF video-mode signature probe
        run: |
          python -m unittest discover -s elf_tooling -p 'test_elf_video_modes.py' -v
          python -m unittest discover -s elf_tooling -p 'test_elf_gs_display.py' -v
          python -m unittest discover -s elf_tooling -p 'test_elf_menu_arrows.py' -v
          python -m py_compile elf_tooling/elf_video_modes.py elf_tooling/elf_gs_display.py
