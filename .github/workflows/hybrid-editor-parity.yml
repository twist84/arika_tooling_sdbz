name: Hybrid editor transform parity

on:
  pull_request:
    paths:
      - 'arika-py_on_rs/**'
      - 'arika-rs/arika_core/**'
      - '.github/workflows/hybrid-editor-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build hybrid backend
        working-directory: arika-py_on_rs
        run: python build.py
      - name: Test native transform math
        working-directory: arika-py_on_rs
        run: cargo test --lib
      - name: Test editor gizmos and stage viewport
        working-directory: arika-py_on_rs
        run: |
          python -m pip install pillow numpy
          python -m unittest test_arika_gizmo test_arika_stage_view3d test_arika_models test_arika_animation_preview test_arika_scene_characters -v
          python -m py_compile arika_scene_editor.py arika_animation_preview.py
