name: Hybrid editor transform parity

on:
  pull_request:
    paths:
      - 'arika-py_on_rs/**'
      - 'arika-rs/arika_core/**'
      - 'elf_tooling/elf_video_modes.py'
      - 'elf_tooling/test_elf_video_modes.py'
      - '.github/workflows/hybrid-editor-parity.yml'
  workflow_dispatch:

jobs:
  parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Build hybrid backend
        working-directory: arika-py_on_rs
        run: python build.py
      - name: Test native transform math
        working-directory: arika-py_on_rs
        run: cargo test --lib
      - name: Test editor gizmos and stage viewport
        working-directory: arika-py_on_rs
        run: |
          python -m pip install -r requirements_scene_editor.txt
          python -m unittest test_arika_editor_shutdown test_arika_stage_background test_arika_scene_project test_arika_gizmo test_arika_stage_view3d test_arika_models test_arika_animation_preview test_arika_scene_characters test_arika_skinning test_arika_menu_navigation test_arika_menu_editor_navigation -v
          python -m py_compile arika_editor.py arika_scene_editor.py arika_scene_project.py arika_stage_background.py arika_animation_preview.py arika_menu_navigation.py arika_menu_editor.py
      - name: Test ELF video-mode signature probe
        run: |
          python -m unittest discover -s elf_tooling -p 'test_elf_video_modes.py' -v
          python -m unittest discover -s elf_tooling -p 'test_elf_gs_display.py' -v
          python -m py_compile elf_tooling/elf_video_modes.py elf_tooling/elf_gs_display.py
